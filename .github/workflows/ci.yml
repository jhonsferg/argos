name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - id: list
        run: |
          echo "modules=$(go work edit -json | jq -c '[.Use[].DiskPath]')" >> "$GITHUB_OUTPUT"

  build-test:
    needs: discover-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out -coverpkg=./...
      - name: sanitize artifact name
        if: always()
        id: artifact-name
        run: echo "name=coverage-unit-$(echo '${{ matrix.module }}' | sed 's#^\./##; s#[/.]#-#g')" >> "$GITHUB_OUTPUT"
      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore
          retention-days: 14
