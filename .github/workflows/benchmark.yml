name: Benchmark

on:
  workflow_dispatch: # manual only - benchmarks run the whole workspace's
    # suite twice (PR branch vs main) and take several minutes, which
    # bottlenecks every PR if run automatically. Trigger from the Actions
    # tab on a PR's branch when a benchmark comparison is actually needed.

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: bench PR branch
        run: |
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            (cd "$m" && go test ./... -bench=. -benchmem -run=^$ | tee -a "$GITHUB_WORKSPACE/bench-pr.txt") || true
          done

      - name: bench main
        run: |
          git worktree add /tmp/argos-main origin/main
          cd /tmp/argos-main
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            (cd "$m" && go test ./... -bench=. -benchmem -run=^$ | tee -a "$GITHUB_WORKSPACE/bench-main.txt") || true
          done

      - name: compare with benchstat
        run: |
          benchstat bench-main.txt bench-pr.txt | tee bench-diff.txt

      - name: comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('bench-diff.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Benchmark comparison vs `main`\n```\n" + diff + "\n```",
            });
