name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - id: list
        run: echo "modules=$(go work edit -json | jq -r '[.Use[].DiskPath] | join(" ")')" >> "$GITHUB_OUTPUT"
      - name: golangci-lint per module
        run: |
          for m in ${{ steps.list.outputs.modules }}; do
            echo "==> lint $m"
            docker run --rm -v "$PWD":/repo -w "/repo/$m" golangci/golangci-lint:latest golangci-lint run ./...
          done
