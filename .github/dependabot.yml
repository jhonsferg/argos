version: 2
updates:
  # Every module in the repository (the root and each nested go.mod), grouped
  # into a single weekly PR
  - package-ecosystem: gomod
    directories:
      - "/**/*"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
