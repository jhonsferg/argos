syntax = "proto3";

package inventory.v1;

option go_package = "github.com/jhonsferg/argos/samples/inventory-api/inventorypb";

service Inventory {
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
}

message ReserveStockRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  string item_id = 1;
  int32 remaining = 2;
}
