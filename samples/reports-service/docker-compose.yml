services:
  cassandra:
    image: cassandra:5
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 5s
      timeout: 10s
      retries: 30

  sftp:
    image: atmoz/sftp:latest
    command: reports:reports:::upload
    ports:
      - "2222:22"
    volumes:
      - ./testdata/sample-report.csv:/home/reports/upload/sample-report.csv:ro
